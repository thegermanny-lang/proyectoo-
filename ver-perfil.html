<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillSwap - Perfil de estudiante</title>
  <link rel="stylesheet" href="./css/ver-perfil.css">
</head>
<body>

  <header class="barra-superior">
    <a href="inicio.html" class="btn-volver">← Volver a inicio</a>
  </header>

  <main class="contenedor-perfil">
    <h1 id="titulo-perfil" class="titulo-perfil">Perfil de estudiante</h1>

    <section class="mitades-perfil">
      <!-- Mitad izquierda: Foto -->
      <div id="zona-foto" class="mitad-izquierda"></div>

      <!-- Mitad derecha: Datos del registro -->
      <div class="mitad-derecha">
        <p class="dato-item"><strong>Nombre:</strong> <span id="dato-nombre"></span></p>
        <p class="dato-item"><strong>Correo:</strong> <span id="dato-correo"></span></p>
        <p class="dato-item"><strong>Número:</strong> <span id="dato-numero"></span></p>
        <p class="dato-item"><strong>Enseña:</strong> <span id="dato-ensena"></span></p>
        <p class="dato-item"><strong>Quiere aprender:</strong> <span id="dato-busca"></span></p>
        <p class="dato-item"><strong>Días disponibles:</strong> <span id="dato-dias"></span></p>
        <p class="dato-item"><strong>Horario:</strong> <span id="dato-turno"></span></p>
      </div>
    </section>
  </main>

  <script src="./js/ver-perfil.js"></script>
</body>
</html>
